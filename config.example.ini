# VitaShelf Launcher config: do not share your real file.
romm_url=http://192.168.1.100:8080
romm_token=rmm_replace_me
# Optional. Defaults to <romm_url>/image when omitted.
image_proxy_url=http://192.168.1.100:8090/image
# Shared Image Service integration also accepts a host (without /image).
# image_service_host=http://192.168.1.100:8090
# Generated once by the app; leave empty to create a new installation ID.
# image_install_id=
# Temporary service diagnostics: 1 = on, 0 = off. Restart after editing.
# Raw curl text can contain private URLs/hosts; inspect before sharing.
tls_debug=0
# Diagnostic TLS 1.2-only experiment; certificate verification stays enabled.
tls12=0
# Optional SteamGridDB artwork for locally installed Vita titles.
steamgriddb_api_key=
romm_download_root=ux0:data/vitashelflauncher/downloads/romm
homebrew_catalog=https://example.invalid/catalog.json
active_theme=default
# ROM view toggled with Triangle: grid, list, or carousel.
active_view=grid
# Optional launch overrides. The arcade core picker writes launch_rom.<rom-id> automatically.
# launch_psx=RETROVITA:pcsx_rearmed
# launch_rom.42=RETROVITA:app0:/mame2000_libretro.self
# Dreamcast/dc already default to Flycast Vita (FLYCASTDC); these show the override form.
# launch_dreamcast=FLYCASTDC
# launch_dc=FLYCASTDC
# DS/nds already default to DSVita (DSVITA000); 3ds/n3ds to Azahar Vita (AZAHARPSV).
# launch_nds=DSVITA000
# launch_ds=DSVITA000
# launch_3ds=AZAHARPSV
# launch_n3ds=AZAHARPSV
# Appearance: wallpaper dark-blue, violet, blue-waves, or light-blue.
# ui_text_color: white, light, dark, or black.
ui_wallpaper=dark-blue
ui_text_color=white
# Animated wallpaper: 1 = on, 0 = off.
ui_wallpaper_animated=1
