# Standalone alternative to compose.dokploy.yml; do not merge the two files.
# Requires a "funnel" entrypoint on bridge-networked Dokploy Traefik (:8091).
# The relay publishes that entrypoint on host loopback; do not publish Traefik's port.
services:
  funnel-relay:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command:
      - "TCP4-LISTEN:8091,bind=0.0.0.0,reuseaddr,fork,max-children=64"
      - "TCP4-CONNECT:dokploy-traefik:8091,connect-timeout=5"
    ports:
      - "127.0.0.1:8091:8091/tcp"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=false"

  imageproxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      IMAGE_PROXY_ADDR: ":8090"
      IMAGE_PROXY_KEY: "${IMAGE_PROXY_KEY:?Set IMAGE_PROXY_KEY for public access}"
      IMAGE_PROXY_KEY_ID: "${IMAGE_PROXY_KEY_ID:?Set IMAGE_PROXY_KEY_ID for public access}"
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imageproxy-funnel.rule=Host(`${IMAGE_PROXY_FUNNEL_HOST:?Set the full Funnel hostname without scheme or path}`)"
      - "traefik.http.routers.imageproxy-funnel.entrypoints=funnel"
      - "traefik.http.routers.imageproxy-funnel.service=vitashelflauncher-imageproxy"
      - "traefik.http.routers.imageproxy-funnel.middlewares=vitashelflauncher-imageproxy-ratelimit"
      - "traefik.http.middlewares.vitashelflauncher-imageproxy-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.vitashelflauncher-imageproxy-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.vitashelflauncher-imageproxy-ratelimit.ratelimit.burst=50"
      - "traefik.http.services.vitashelflauncher-imageproxy.loadbalancer.server.port=8090"

networks:
  dokploy-network:
    external: true
